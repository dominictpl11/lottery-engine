<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>春节抽奖 · Lottery Engine</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1 id="activity-name">幸运大转盘</h1>
  <p class="sub" id="activity-sub">加载中…</p>
  <div class="marquee"><div class="marquee-track" id="marquee"></div></div>
</header>

<main>
  <div class="stage">
    <div class="grid-frame">
      <div class="lights" id="lights"></div>
      <div class="grid" id="grid"></div>
    </div>
    <p class="hint" id="stage-hint">今日还可抽 <b id="left-count">–</b> 次</p>
  </div>

  <section class="card">
    <h2>奖品一览</h2>
    <div class="prizes" id="prizes"></div>
  </section>

</main>

<footer>
  <a href="https://github.com/dominictpl11/lottery-engine">GitHub</a> ·
  <a href="/dev">开发者页</a>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modal-card">
    <div class="icon" id="modal-icon">🎉</div>
    <h3 id="modal-title">恭喜获得</h3>
    <div class="prize-name" id="modal-prize"></div>
    <div class="note" id="modal-note"></div>
    <button id="modal-close">开心收下</button>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

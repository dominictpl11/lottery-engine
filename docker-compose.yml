# 本地依赖环境（REQUIREMENTS.md §8.2 / NFR-6）。
#
#   docker compose up -d
#
# Phase 1 只提供 MySQL 与 Redis；API 自身的容器化在 Phase 5 并入（§8.6）。
#
# MySQL 映射到宿主机 3307 而不是 3306，避免与本机已有的 MySQL 实例冲突。

services:
  mysql:
    image: mysql:8.4
    container_name: lottery-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lottery_db}
      MYSQL_USER: ${MYSQL_USER:-lottery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lottery}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 固定为 UTC：DATETIME 列存的是 naive UTC（§4.4），若服务器时区不是 UTC，
      # 任何用 CURRENT_TIMESTAMP 的手工 SQL 都会写入与应用不一致的时刻。
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lottery-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:

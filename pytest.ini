; NOTE: keep this file pure ASCII. pytest reads ini files with the system
; locale encoding, same trap as requirements.txt and alembic.ini.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    concurrency: tests that hammer the API from many threads (slower)

; Third-party deprecation noise (starlette TestClient -> anyio). Not our code.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning

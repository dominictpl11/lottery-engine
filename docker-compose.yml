# 本地依赖环境（REQUIREMENTS.md §8.2 / NFR-6）。
#
#   docker compose up -d
#
# Phase 1 只提供 MySQL 与 Redis；API 自身的容器化在 Phase 5 并入（§8.6）。
#
# MySQL 映射到宿主机 3307 而不是 3306，避免与本机已有的 MySQL 实例冲突。

services:
  mysql:
    image: mysql:8.4
    container_name: lottery-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-[REDACTED_LOCAL_CREDENTIAL]}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lottery_db}
      MYSQL_USER: ${MYSQL_USER:-lottery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-[REDACTED_LOCAL_CREDENTIAL]}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 固定为 UTC：DATETIME 列存的是 naive UTC（§4.4），若服务器时区不是 UTC，
      # 任何用 CURRENT_TIMESTAMP 的手工 SQL 都会写入与应用不一致的时刻。
      - --default-time-zone=+00:00
      # 默认 151。压测时 4 worker x (pool 40 + overflow 20) = 240 条，
      # 不放开的话瓶颈会假性地落在 MySQL 而不是真实的资源上限。
      - --max-connections=500
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化数据卷时执行：额外建一个 lottery_test 库给测试用，
      # 测试与开发数据彻底隔离。改动这里需要 `docker compose down -v` 重建卷。
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-[REDACTED_LOCAL_CREDENTIAL]}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lottery-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: lottery-api
    restart: unless-stopped
    environment:
      # 容器之间用服务名互相寻址，不走宿主机端口。
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-lottery}:${MYSQL_PASSWORD:[REDACTED_LOCAL_CREDENTIAL]@mysql:3306/${MYSQL_DATABASE:-lottery_db}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
      RATE_LIMIT_MAX_COUNT: ${RATE_LIMIT_MAX_COUNT:-3}
    ports:
      # 宿主机端口可改：本机 8000 若已被别的项目占用，在 .env 里设 API_HOST_PORT。
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql_data:
  redis_data:
